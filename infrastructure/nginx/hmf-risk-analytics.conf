server {
    listen 80;
    listen [::]:80;

    server_name dashboard.hmf.co.id;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://dashboard.hmf.co.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dashboard.hmf.co.id;
    server_tokens off;

    ssl_certificate
        /etc/letsencrypt/live/dashboard.hmf.co.id/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/dashboard.hmf.co.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HMFSSL:10m;
    ssl_session_tickets off;

    root /var/www/hmf-risk-analytics;
    index index.html;

    client_max_body_size 1m;

    auth_basic "HMF Risk Analytics";
    auth_basic_user_file /etc/nginx/hmf-risk-users;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/admin/refresh {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Refresh "hmf-local-nginx-refresh";

        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Refresh "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
